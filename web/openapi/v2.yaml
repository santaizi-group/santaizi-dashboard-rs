openapi: 3.0.3
info:
  title: Santaizi HTTP API
  version: 2.0.0
  description: |
    Santaizi Primary 的公开状态和管理接口。浏览器会话使用 Cookie 与 CSRF，
    自动化客户端使用 Bearer Token。Telemetry/Replication 可靠链路仍使用 gRPC。
servers:
- url: /
  description: 当前站点（同源）
- url: https://monitor.example.com
  description: 示例部署地址
tags:
- name: Auth
  description: 管理会话
- name: Public
  description: ServerStatus 公开数据
- name: Servers
  description: 服务器管理
- name: Monitors
  description: 服务监控
- name: Notifications
  description: 通知和告警规则
- name: Network
  description: DDNS 与 NAT
- name: Settings
  description: 站点设置
- name: Telemetry
  description: Collector、Observer 和可靠性
- name: Probes
  description: 探测型从端主动探测结果
- name: Bot
  description: Telegram 机器人
security:
- cookieAuth: []
- bearerAuth: []
paths:
  /api/v2/auth/session:
    get:
      tags:
      - Auth
      summary: 获取当前会话
      description: 返回当前管理员会话。浏览器写操作前需读取 `csrf_token`，并放在 `X-CSRF-Token` 请求头。
      operationId: getSession
      security: []
      responses:
        '200':
          $ref: '#/components/responses/SessionResponse'
  /api/v2/auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录
      description: 结束 Cookie 会话。使用 Cookie 鉴权时须携带 CSRF Token。
      operationId: logout
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/bootstrap:
    get:
      tags:
      - Public
      summary: 公开站点引导信息
      operationId: getPublicBootstrap
      security: []
      responses:
        '200':
          $ref: '#/components/responses/BootstrapResponse'
  /api/v2/public/view-password/session:
    post:
      tags:
      - Public
      summary: 校验站点访问密码
      description: 站点启用访问密码时，校验密码并建立查看会话。
      operationId: createViewPasswordSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  format: password
      responses:
        '204':
          description: Verified
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/servers:
    get:
      tags:
      - Public
      summary: 公开服务器列表
      description: 公开 ServerStatus 服务器列表；可通过 `x-websocket` 订阅实时状态。匿名与查看密码会话的 `host` 不含公网 IP；Bearer Token 返回与管理接口相同的明文 `ip` / `ipv4` / `ipv6`。
      operationId: listPublicServers
      x-websocket: /ws/v2/public/runtime
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ServerListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开服务器详情
      description: 公开 ServerStatus 服务器详情。匿名与查看密码会话的 `host` 不含公网 IP；Bearer Token 返回明文地址。
      operationId: getPublicServer
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/services:
    get:
      tags:
      - Public
      summary: 公开服务监控列表
      operationId: listPublicServices
      security: []
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/network/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开网络延迟历史
      description: 返回该服务器近 24 小时的服务监控延迟点。`data` 为数组，每项含 `monitor_name`、`created_at`（毫秒时间戳）与 `avg_delay`。
      operationId: getPublicNetworkHistory
      security: []
      responses:
        '200':
          $ref: '#/components/responses/MonitorHistoryListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/cycle-transfer:
    get:
      tags:
      - Public
      summary: 公开周期流量摘要
      description: 返回已启用流量策略的当前窗口用量；可按 server_id 过滤。不含通知标签等管理字段。
      operationId: listPublicCycleTransfer
      security: []
      parameters:
      - name: server_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      responses:
        '200':
          $ref: '#/components/responses/CycleTransferListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/servers/{serverId}/availability:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开服务器可用性摘要
      description: |
        对齐上游前台可用性聚合。站点关闭 `show_availability_to_guest` 时，匿名与查看密码会话返回 403；管理员 Cookie 与 Bearer Token 仍可读取。
        从未上报的服务器 `availability_percent` 为 null。
      operationId: getPublicServerAvailability
      security: []
      parameters:
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 3660
          default: 30
      responses:
        '200':
          $ref: '#/components/responses/PublicAvailabilityResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/public/metrics/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Public
      summary: 公开资源历史
      description: |
        从 StateRollup 读取该服务器当前节点的 CPU / 内存 / 磁盘 / 网速 / 进程数 / TCP / UDP 平均值序列。
        无节点绑定或无数据时返回空列表，不返回 404。
        优先使用成对的 `start`/`end`（RFC3339 或 Unix 秒）；跨度超过该分辨率保留期时返回 400，不夹取。
        未提供起止时，`hours` 为相对回看（默认 24，最小 0.5），超过保留期时夹取。
      operationId: getPublicMetrics
      security: []
      parameters:
      - name: resolution
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1m
          - 1h
          default: 1m
      - name: start
        in: query
        required: false
        description: 窗口开始。RFC3339 或 Unix 秒。须与 end 成对使用，优先于 hours。
        schema:
          type: string
      - name: end
        in: query
        required: false
        description: 窗口结束。RFC3339 或 Unix 秒。须晚于 start。
        schema:
          type: string
      - name: hours
        in: query
        required: false
        description: 相对回看小时数（无 start/end 时）。支持 0.5；超过保留期时夹取。
        schema:
          type: number
          minimum: 0.5
          default: 24
      responses:
        '200':
          $ref: '#/components/responses/PublicMetricListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/summary:
    get:
      tags:
      - Settings
      summary: 管理概览摘要
      operationId: getAdminSummary
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers:
    get:
      tags:
      - Servers
      summary: 服务器列表
      description: 管理服务器列表。`host.ip` / `host.ipv4` / `host.ipv6` 为探针上报的明文公网地址，不脱敏。
      operationId: listServers
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Order'
      responses:
        '200':
          $ref: '#/components/responses/ServerListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Servers
      summary: 创建服务器
      description: 可选 `traffic_policies` 与服务器在同一事务写入；缺省不创建策略。
      operationId: createServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerWrite'
      responses:
        '201':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/export:
    get:
      tags:
      - Servers
      summary: 导出服务器配置
      description: 导出全部主机配置、流量策略与探针认证密钥明文。用于灾难恢复与重装；请妥善保管导出文件。不含运行态与流量用量。
      operationId: exportServers
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/ServerBackupResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/import/preview:
    post:
      tags:
      - Servers
      summary: 预览服务器导入
      description: 按主机名称精确匹配，返回每条建议动作。不写入。
      operationId: previewServerImport
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerBackup'
      responses:
        '200':
          $ref: '#/components/responses/ServerImportPreviewResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/import:
    post:
      tags:
      - Servers
      summary: 导入服务器配置
      description: 按预览结果执行新建或覆盖。新建时若备份含密钥且未被占用则直接复用；冲突或未带密钥则生成新密钥。覆盖只改配置与流量策略，不改密钥。覆盖时流量策略去掉 id 后全量替换。
      operationId: importServers
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerImportWrite'
      responses:
        '200':
          $ref: '#/components/responses/ServerImportResultResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 服务器详情
      description: 管理服务器详情。`host.ip` / `host.ipv4` / `host.ipv6` 为探针上报的明文公网地址，不脱敏。
      operationId: getServer
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Servers
      summary: 更新服务器
      description: 可选 `traffic_policies` 按 id upsert、缺席删除；缺省不动既有策略。
      operationId: updateServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerWrite'
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Servers
      summary: 删除服务器
      operationId: deleteServer
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/availability:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 服务器可用性记录
      operationId: listServerAvailability
      x-ui-route: /admin/servers
      parameters:
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ObjectListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/display-index:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    patch:
      tags:
      - Servers
      summary: 更新服务器排序权重
      operationId: updateServerDisplayIndex
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerDisplayIndexWrite'
      responses:
        '200':
          $ref: '#/components/responses/ServerResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/server-groups:
    get:
      tags:
      - Servers
      summary: 服务器分组列表
      operationId: listServerGroups
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/ServerGroupListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/server-groups/rename:
    post:
      tags:
      - Servers
      summary: 重命名服务器分组
      operationId: renameServerGroup
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/ServerGroupRenameWrite'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/reset-secret:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 重置服务器密钥
      operationId: resetServerSecret
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/ServerSecretResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/reset-availability:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 重置服务器可用性统计
      operationId: resetServerAvailability
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/credential:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 查看服务器密钥
      operationId: getServerCredential
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/ServerCredentialResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/install-preview:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 生成安装命令预览
      operationId: getServerInstallPreview
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/InstallPreviewWrite'
      responses:
        '200':
          $ref: '#/components/responses/InstallPreviewResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/upgrade-preview:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    post:
      tags:
      - Servers
      summary: 生成探针升级命令
      description: 按平台返回本机升级脚本命令。不包含密钥，不修改配置、节点身份或 WAL。
      operationId: getServerUpgradePreview
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/UpgradePreviewWrite'
      responses:
        '200':
          $ref: '#/components/responses/UpgradePreviewResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/probe-capabilities:
    get:
      tags:
      - Servers
      summary: 探针能力清单
      operationId: getProbeCapabilities
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/ProbeCapabilitiesResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-policies:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 流量策略列表
      operationId: listTrafficPolicies
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/TrafficPolicyListResponse'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Servers
      summary: 创建流量策略
      operationId: createTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/TrafficPolicyWrite'
      responses:
        '201':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-policies/{policyId}:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    - name: policyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      tags:
      - Servers
      summary: 流量策略详情
      operationId: getTrafficPolicy
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Servers
      summary: 更新流量策略
      operationId: updateTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/TrafficPolicyWrite'
      responses:
        '200':
          $ref: '#/components/responses/TrafficPolicyResponse'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - Servers
      summary: 删除流量策略
      operationId: deleteTrafficPolicy
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Deleted
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-history:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    get:
      tags:
      - Servers
      summary: 服务器流量策略历史
      description: |
        返回该服务器全部流量策略的当前窗口用量、近 24 小时按小时序列，以及当前窗口内按天序列（最多回溯 90 天）。
        `tz` 为 IANA 时区，用于按天切日界；非法或空则按 UTC。无节点绑定或无 rollup 时序列为 0，不返回 404。
      operationId: getServerTrafficHistory
      x-ui-route: /admin/servers
      parameters:
      - name: tz
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          $ref: '#/components/responses/TrafficHistoryListResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/{serverId}/traffic-policies/{policyId}/usage:
    parameters:
    - $ref: '#/components/parameters/ServerId'
    - name: policyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    get:
      tags:
      - Servers
      summary: 流量策略用量
      operationId: getTrafficPolicyUsage
      x-ui-route: /admin/servers
      responses:
        '200':
          $ref: '#/components/responses/TrafficUsageResponse'
        default:
          $ref: '#/components/responses/Problem'
  /api/v2/admin/servers/batch/group:
    post:
      tags:
      - Servers
      summary: 批量更新服务器分组
      operationId: batchUpdateServerGroup
      x-ui-route: /admin/servers
      security:
      - cookieAuth: []
        csrfHeader: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        $ref: '#/components/requestBodies/BatchServerGroupWrite'
      responses:
