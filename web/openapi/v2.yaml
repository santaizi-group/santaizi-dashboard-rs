        MemTotal:
          type: integer
          format: int64
          description: 内存总量（字节）。用量在 State.MemUsed。
        DiskTotal:
          type: integer
          format: int64
          description: 磁盘总量（字节）。用量在 State.DiskUsed。
        SwapTotal:
          type: integer
          format: int64
        Arch:
          type: string
