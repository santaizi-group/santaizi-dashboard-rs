components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: santaizi-dashboard
      description: 管理员 OAuth 会话 Cookie
    bearerAuth:
      type: http
      scheme: bearer
      description: 'API Token（Authorization: Bearer）'
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 浏览器 Cookie 会话写操作必填；值来自 GET /api/v2/auth/session 的 csrf_token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CollectorId:
      name: collectorId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    Sort:
      name: sort
      in: query
      schema:
        type: string
        maxLength: 64
    Order:
      name: order
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 会话写操作时必填；Bearer Token 调用可省略
      schema:
        type: string
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Meta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64
        next_cursor:
          type: string
    Session:
      type: object
      required:
      - authenticated
      - csrf_token
      - login_url
      - capabilities
      - version
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
        login_url:
          type: string
        version:
          type: string
          description: 当前面板二进制版本，与公开 Bootstrap.version 同义
        capabilities:
          type: array
          items:
            type: string
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - login
      - name
      - super_admin
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
        avatar_url:
          type: string
        super_admin:
          type: boolean
