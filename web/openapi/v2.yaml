        ip:
          type: string
          description: 探针上报的公网地址；双栈为 `IPv4/IPv6`。管理接口与 Bearer Token 公开请求返回。
        ipv4:
          type: string
          description: 从 `ip` 拆出的 IPv4。管理接口与 Bearer Token 公开请求返回。
        ipv6:
          type: string
          description: 从 `ip` 拆出的 IPv6。管理接口与 Bearer Token 公开请求返回。
