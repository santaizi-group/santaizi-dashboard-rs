name: Run Tests

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 权威 proto 在面板 Go 仓（仓库名 santanzi-dashboard）。
      - uses: actions/checkout@v4
        with:
          repository: santaizi-group/santanzi-dashboard
          path: upstream-dashboard

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2

      - name: Check vendored proto
        run: bash script/proto-diff.sh upstream-dashboard/proto/santaizi.proto

      # rust-embed folder 指向 resource/web/（前端构建产物），先构建再跑 Rust 门。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build web frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  # Release 是唯一另一处链接 aarch64 的地方；提前在 PR 阶段暴露交叉编译问题。
  cross:
    name: Cross build (linux arm64)
    runs-on: ubuntu-latest
    env:
      # cargo 默认用宿主 cc 链接 aarch64；显式指向交叉工具链。
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aarch64 GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu

      # rust-embed 在编译期要求 resource/web/ 存在，交叉构建同样要先构建前端。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build web frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
