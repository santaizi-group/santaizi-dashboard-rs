name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64

    name: Build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      # cargo 默认用宿主 cc 链接 aarch64；显式指向交叉工具链（x86 矩阵项忽略）。
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid tag: $tag"
            echo "Expected SemVer vMAJOR.MINOR.PATCH (v0.x allowed)"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aarch64 GNU toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Sync crate version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # 只改 [package] 的 version，不动依赖版本。
          sed -i '0,/^version = /s/^version = ".*"/version = "'"${version}"'"/' Cargo.toml

      # GeoIP 开箱即用：拉真库替换 resource/geoip.db 占位，随二进制内嵌。
      - name: Fetch GeoIP database
        shell: bash
        run: |
          set -euo pipefail
          echo "geoip_week=$(date -u +%g%V)" >> "$GITHUB_ENV"
          # 发布在独立 job，经 outputs 把周次带给 release notes。
          echo "geoip_week=$(date -u +%g%V)" >> "$GITHUB_OUTPUT"
          bash script/fetch-geoip.sh -o resource/geoip.db
          test -s resource/geoip.db

      # 二进制内嵌前端产物（rust-embed resource/web/）。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build web frontend
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          cp "target/${{ matrix.target }}/release/santaizi-dashboard" "bin/santaizi-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"
          zip -j -9 "bin/santaizi-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "bin/santaizi-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"
          rm "bin/santaizi-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}"

      # 两个原因不能在各矩阵 job 里直接发 Release：私有仓 Actions artifact
      # 额度按账号共用（约 500MB），且矩阵并行时后创建的正式 Release 必被
      # GitHub 拒 422 already_exists。产物先传本 run 草稿，由 release job
      # 取回双架构后合并发布（同探针仓三段式）。
      - name: Upload binaries to temporary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "$CI_TAG" >/dev/null 2>&1; then
              break
            fi
            gh release create "$CI_TAG" \
              --draft \
              --target "${{ github.sha }}" \
              --title "CI artifacts ${{ github.run_id }}" \
              --notes "Temporary build outputs for ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Deleted after publish." \
              && break || true
            sleep 2
          done
          gh release view "$CI_TAG" >/dev/null
          shopt -s nullglob
          files=(bin/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no build outputs to upload" >&2
            exit 1
          fi
          gh release upload "$CI_TAG" "${files[@]}" --clobber

  release:
    runs-on: ubuntu-latest
    needs: build
    name: Release
    permissions:
      contents: write
    steps:
      # gh 从 git remote 推断仓库；本 job 无 checkout，必须显式 GH_REPO，
      # 否则下载报 "not a git repository"。
      - name: Download binaries from temporary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          mkdir -p bin
          gh release download "$CI_TAG" --dir bin
          ls -la bin/

      - name: Checksum
        run: sha256sum ./bin/*.zip | awk -F" |/" '{print $1, $NF}' > checksums.txt

      - name: Publish tag release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "checksums.txt,bin/*.zip"
          body: "GeoIP week: ${{ needs.build.outputs.geoip_week }}"
          generateReleaseNotes: true

  image:
    name: Build image
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  cleanup:
    name: Cleanup CI release
    permissions:
      contents: write
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [build, release]
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary CI release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          if gh release view "$CI_TAG" >/dev/null 2>&1; then
            gh release delete "$CI_TAG" --yes
          else
            echo "no temporary release $CI_TAG to delete"
          fi
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/$CI_TAG" >/dev/null 2>&1 || true
